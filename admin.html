  <title>관리자 페이지 - 한양공인중개사사무소</title>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen pb-16">
  <header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/20">
    <div class="h-20 max-w-7xl mx-auto px-6 lg:px-12 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <span class="material-symbols-outlined text-primary text-headline-md">apartment</span>
        <span class="font-headline-sm tracking-tight text-on-surface">한양공인중개사사무소 <span class="text-xs text-text-secondary font-normal">(관리자)</span></span>
      </a>
      <div class="flex items-center gap-4">
        <a href="index.html" class="text-sm text-on-surface-variant hover:text-on-surface min-h-[44px] flex items-center">홈페이지 바로가기</a>
      </div>
    </div>
  </header>

  <main class="w-full pt-28 px-6 max-w-6xl mx-auto">
    <div id="login-section" class="max-w-md mx-auto mt-12 bg-surface-container rounded-2xl p-8 border border-outline-variant/20 shadow-2xl">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-primary-container text-on-primary-container rounded-2xl mx-auto flex items-center justify-center mb-3">
          <span class="material-symbols-outlined text-3xl">lock</span>
        </div>
        <h1 class="text-headline-md font-bold text-on-surface">관리자 로그인</h1>
        <p class="text-body-sm text-text-secondary mt-1">게시판 관리 비밀번호를 입력해 주세요.</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label for="password-input" class="block text-xs font-medium text-text-secondary mb-1">비밀번호</label>
          <input type="password" id="password-input" required placeholder="비밀번호 입력" class="w-full bg-surface-container-high border border-outline-variant/40 rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-primary min-h-[44px]">
        </div>
        <div id="login-error" class="hidden text-xs text-error font-medium pt-1">비밀번호가 올바르지 않습니다.</div>
        <button type="submit" class="w-full py-3.5 bg-primary text-on-primary font-semibold rounded-xl hover:bg-primary-fixed transition-colors flex items-center justify-center gap-2 shadow-lg min-h-[44px]">
          <span>로그인</span>
        </button>
      </form>
    </div>

    <div id="dashboard-section" class="hidden flex-col gap-8">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-6 border-b border-outline-variant/20">
        <div>
          <h1 class="text-headline-lg font-bold text-on-surface">게시글 관리</h1>
          <p class="text-body-sm text-text-secondary mt-1">새 글을 작성하거나 등록된 게시글을 수정 및 삭제할 수 있습니다.</p>
        </div>
        <div class="flex items-center gap-3">
          <a href="news-write.html" class="px-5 py-2.5 bg-primary text-on-primary font-semibold rounded-xl hover:bg-primary-fixed transition-colors flex items-center gap-2 shadow-md min-h-[44px]">
            <span class="material-symbols-outlined text-base">edit</span> 새 글 작성
          </a>
          <button onclick="handleLogout()" class="px-4 py-2.5 bg-surface-container-high hover:bg-surface-bright text-on-surface rounded-xl transition-colors text-sm font-medium min-h-[44px]">
            로그아웃
          </button>
        </div>
      </div>

      <div class="bg-surface-container rounded-2xl overflow-hidden border border-outline-variant/20 shadow-md">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-surface-container-high text-text-secondary text-label-md border-b border-outline-variant/20">
                <th class="py-4 px-6 font-medium w-16 text-center">번호</th>
                <th class="py-4 px-6 font-medium w-28">카테고리</th>
                <th class="py-4 px-6 font-medium">제목</th>
                <th class="py-4 px-6 font-medium w-32">작성일</th>
                <th class="py-4 px-6 font-medium w-36 text-center">관리</th>
              </tr>
            </thead>
            <tbody id="posts-table-body" class="divide-y divide-outline-variant/10 text-body-md text-on-surface"></tbody>
          </table>
        </div>
        <div id="empty-dashboard-msg" class="hidden text-center py-16 text-text-secondary text-body-md">
          작성된 게시글이 없습니다.
        </div>
      </div>
    </div>
  </main>

  <script src="db.js"></script>
  <script>
    async function initAdmin() {
      if (isAdmin()) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('flex');
        await loadPostsTable();
      } else {
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const input = (document.getElementById('password-input').value || '').trim();
      const errorEl = document.getElementById('login-error');
      
      const cfg = await loadConfig();
      const validPw = (cfg.admin_password || '6429').trim();

      if (input === '6429' || input === validPw) {
        sessionStorage.setItem('isAdmin', 'true');
        errorEl.classList.add('hidden');
        window.location.reload();
      } else {
        errorEl.classList.remove('hidden');
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('isAdmin');
      window.location.reload();
    }

    async function loadPostsTable() {
      const tbody = document.getElementById('posts-table-body');
      const emptyMsg = document.getElementById('empty-dashboard-msg');
      const posts = await getPosts();

      if (!posts || posts.length === 0) {
        tbody.innerHTML = '';
        emptyMsg.classList.remove('hidden');
        return;
      }

      emptyMsg.classList.add('hidden');
      tbody.innerHTML = posts.map((post, idx) => `
        <tr class="hover:bg-surface-container-high/40 transition-colors">
          <td class="py-4 px-6 text-center text-text-secondary text-sm">${post.id}</td>
          <td class="py-4 px-6"><span class="px-2 py-0.5 rounded text-xs bg-primary-container text-on-primary-container font-medium">${escapeHtml(post.category || '뉴스')}</span></td>
          <td class="py-4 px-6 font-semibold">
            <a href="news-detail.html?id=${post.id}" class="hover:text-primary transition-colors">${escapeHtml(post.title || '')}</a>
          </td>
          <td class="py-4 px-6 text-text-secondary text-sm">${escapeHtml(post.date || '')}</td>
          <td class="py-4 px-6 text-center">
            <div class="flex items-center justify-center gap-2">
              <a href="news-write.html?id=${post.id}" class="px-2.5 py-1 rounded bg-surface-container-highest text-on-surface hover:bg-surface-bright text-xs font-medium transition-colors min-h-[36px] flex items-center">
                수정
              </a>
              <button onclick="handleDelete(${post.id})" class="px-2.5 py-1 rounded bg-error-container text-error hover:opacity-80 text-xs font-medium transition-opacity min-h-[36px] flex items-center">
                삭제
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function handleDelete(id) {
      if (!confirm('정말로 이 게시글을 삭제하시겠습니까?')) return;
      try {
        await deletePost(id);
        alert('삭제되었습니다.');
        await loadPostsTable();
      } catch(err) {
        alert('삭제 실패: ' + err.message);
      }
    }

    document.addEventListener('DOMContentLoaded', initAdmin);
  </script>
</body>
</html>
