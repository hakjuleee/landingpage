        <a href="admin.html" class="text-sm text-outline hover:text-primary min-h-[44px] flex items-center">취소</a>

  <script src="db.js"></script>
  <script>
    let editPostId = null;
    let isPreviewOpen = false;
    let currentImageTab = 'url';

    function togglePreview() {
      const container = document.getElementById('preview-container');
      const btnText = document.getElementById('preview-btn-text');
      isPreviewOpen = !isPreviewOpen;

      if (isPreviewOpen) {
        container.classList.remove('hidden');
        btnText.textContent = '미리보기 닫기';
        updateLivePreview();
      } else {
        container.classList.add('hidden');
        btnText.textContent = '실시간 미리보기 켜기';
      }
    }

    function updateLivePreview() {
      if (!isPreviewOpen) return;
      const content = document.getElementById('post-content-input').value;
      const previewEl = document.getElementById('preview-content');
      previewEl.innerHTML = renderMarkdown(content || '<span class="text-text-secondary italic">본문 내용을 입력하면 여기에 실시간으로 렌더링됩니다.</span>');
    }

    function toggleTableDropdown() {
      const dd = document.getElementById('table-dropdown');
      dd.classList.toggle('hidden');
    }

    // 외부 클릭 시 드롭다운 닫기
    document.addEventListener('click', (e) => {
      const dd = document.getElementById('table-dropdown');
      if (dd && !dd.contains(e.target) && !e.target.closest('button[onclick="toggleTableDropdown()"]')) {
        dd.classList.add('hidden');
      }
    });

    function insertTextAtCursor(before, after = '') {
      const textarea = document.getElementById('post-content-input');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const selected = text.substring(start, end);

      const replacement = before + (selected || '') + after;
      textarea.value = text.substring(0, start) + replacement + text.substring(end);
      textarea.focus();
      textarea.selectionStart = start + before.length;
      textarea.selectionEnd = start + before.length + (selected ? selected.length : 0);

      updateLivePreview();
    }

    function insertTableTemplate(type) {
      document.getElementById('table-dropdown').classList.add('hidden');
      let template = '';

      if (type === 'general') {
        template = `\n<table class="w-full text-left border-collapse">\n  <thead>\n    <tr>\n      <th>구분</th>\n      <th>내용</th>\n      <th>비고</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>항목 1</td>\n      <td>상세 내용 입력</td>\n      <td>참고사항</td>\n    </tr>\n    <tr>\n      <td>항목 2</td>\n      <td>상세 내용 입력</td>\n      <td>-</td>\n    </tr>\n  </tbody>\n</table>\n\n`;
      } else if (type === 'property') {
        template = `\n<table class="w-full text-left border-collapse">\n  <thead>\n    <tr>\n      <th>항목</th>\n      <th>상세 사양</th>\n      <th>특징</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>소재지</td>\n      <td>성남시 분당구 금곡동 청솔주공9단지</td>\n      <td>미금역 역세권</td>\n    </tr>\n    <tr>\n      <td>공급/전용면적</td>\n      <td>74㎡ / 59.8㎡</td>\n      <td>인기 판상형</td>\n    </tr>\n    <tr>\n      <td>해당층/총층</td>\n      <td>12층 / 15층</td>\n      <td>로얄층 남향</td>\n    </tr>\n    <tr>\n      <td>입주 가능일</td>\n      <td>즉시입주 가능</td>\n      <td>올수리 완료</td>\n    </tr>\n  </tbody>\n</table>\n\n`;
      } else if (type === 'price') {
        template = `\n<table class="w-full text-left border-collapse">\n  <thead>\n    <tr>\n      <th>계약일</th>\n      <th>전용면적</th>\n      <th>층수</th>\n      <th>실거래가</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>2026.11</td>\n      <td>59.8㎡</td>\n      <td>10층</td>\n      <td>9억 6,000만원</td>\n    </tr>\n    <tr>\n      <td>2026.10</td>\n      <td>59.8㎡</td>\n      <td>7층</td>\n      <td>9억 4,500만원</td>\n    </tr>\n  </tbody>\n</table>\n\n`;
      } else if (type === 'markdown') {
        template = `\n| 구분 | 상세 내용 | 비고 |\n| :--- | :--- | :--- |\n| 항목 1 | 내용 1 | 비고 1 |\n| 항목 2 | 내용 2 | 비고 2 |\n\n`;
      }

      insertTextAtCursor(template);
    }

    function insertFormatting(type) {
      if (type === 'h2') insertTextAtCursor('\n## ', '\n');
      else if (type === 'bold') insertTextAtCursor('**', '**');
      else if (type === 'italic') insertTextAtCursor('*', '*');
      else if (type === 'link') insertTextAtCursor('[링크 텍스트](', 'https://)');
      else if (type === 'hr') insertTextAtCursor('\n---\n\n');
      else if (type === 'ul') insertTextAtCursor('\n- ', '\n');
    }

    function openImageModal() {
      document.getElementById('image-modal').classList.remove('hidden');
      document.getElementById('image-modal').classList.add('flex');
    }

    function closeImageModal() {
      document.getElementById('image-modal').classList.remove('flex');
      document.getElementById('image-modal').classList.add('hidden');
    }

    function switchImageTab(tab) {
      currentImageTab = tab;
      const tabUrl = document.getElementById('img-tab-url');
      const tabFile = document.getElementById('img-tab-file');
      const modeUrl = document.getElementById('img-mode-url');
      const modeFile = document.getElementById('img-mode-file');

      if (tab === 'url') {
        tabUrl.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-primary text-on-primary';
        tabFile.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-surface-container-high text-on-surface-variant hover:text-on-surface';
        modeUrl.classList.remove('hidden');
        modeFile.classList.add('hidden');
      } else {
        tabFile.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-primary text-on-primary';
        tabUrl.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-surface-container-high text-on-surface-variant hover:text-on-surface';
        modeFile.classList.remove('hidden');
        modeUrl.classList.add('hidden');
      }
    }

    function confirmInsertImage() {
      if (currentImageTab === 'url') {
        const url = document.getElementById('modal-img-url').value.trim();
        const alt = document.getElementById('modal-img-alt').value.trim() || '게시글 이미지';
        if (!url) {
          alert('이미지 URL을 입력해 주세요.');
          return;
        }
        const imgTag = `\n<img src="${url}" alt="${alt}">\n\n`;
        insertTextAtCursor(imgTag);
        document.getElementById('modal-img-url').value = '';
        document.getElementById('modal-img-alt').value = '';
        closeImageModal();
      } else {
        const fileInput = document.getElementById('modal-img-file');
        const alt = document.getElementById('modal-img-alt-file').value.trim() || '게시글 이미지';
        const file = fileInput.files[0];
        if (!file) {
          alert('이미지 파일을 선택해 주세요.');
          return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          const base64 = e.target.result;
          const imgTag = `\n<img src="${base64}" alt="${alt}">\n\n`;
          insertTextAtCursor(imgTag);
          fileInput.value = '';
          document.getElementById('modal-img-alt-file').value = '';
          closeImageModal();
        };
        reader.readAsDataURL(file);
      }
    }

    async function initForm() {
      requireAdmin();

      const params = new URLSearchParams(window.location.search);
      editPostId = params.get('id');

      if (editPostId) {
        document.getElementById('page-heading').textContent = '게시글 수정';
        document.getElementById('btn-text').textContent = '수정사항 저장';
        const post = await getPostById(editPostId);
        if (post) {
          document.getElementById('post-category-input').value = post.category || '부동산 뉴스';
          document.getElementById('post-title-input').value = post.title || '';
          document.getElementById('post-content-input').value = post.content || '';
          if (isPreviewOpen) updateLivePreview();
        }
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      const category = document.getElementById('post-category-input').value.trim();
      const title = document.getElementById('post-title-input').value.trim();
      const content = document.getElementById('post-content-input').value.trim();

      if (!title || !content) {
        alert('제목과 내용을 모두 입력해 주세요.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50');

      try {
        if (editPostId) {
          await updatePost(editPostId, { title, category, content });
          alert('게시글이 성공적으로 수정되었습니다.');
        } else {
          await createPost({ title, category, content });
          alert('새 게시글이 성공적으로 등록되었습니다.');
        }
        window.location.href = 'admin.html';
      } catch(err) {
        alert('저장 실패: ' + err.message);
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50');
      }
    }

    document.addEventListener('DOMContentLoaded', initForm);
  </script>
</body>
</html>
