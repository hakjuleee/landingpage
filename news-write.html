</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen pb-24 md:pb-12">
  <header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/20">
    <div class="h-20 max-w-7xl mx-auto px-6 lg:px-12 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="admin.html" class="flex items-center gap-2 text-primary font-headline-sm min-h-[44px]">
          <span class="material-symbols-outlined text-headline-md">admin_panel_settings</span>
          <span class="text-on-surface font-semibold">관리자 대시보드</span>
        </a>
      </div>
      <div class="flex items-center gap-4">
        <a href="admin.html" class="text-sm text-on-surface-variant hover:text-on-surface min-h-[44px] flex items-center">대시보드로 복귀</a>
        <a href="news.html" class="text-sm text-on-surface-variant hover:text-on-surface min-h-[44px] flex items-center">게시판 보기</a>
      </div>
    </div>
  </header>

  <main class="w-full pt-28 px-6 max-w-4xl mx-auto">
    <div class="bg-surface-container rounded-2xl p-6 md:p-10 border border-outline-variant/20 shadow-xl">
      <div class="flex items-center justify-between pb-6 border-b border-outline-variant/20 mb-6">
        <h1 id="page-heading" class="text-headline-md font-bold text-on-surface">새 게시글 작성</h1>
        <a href="admin.html" class="text-sm text-outline hover:text-primary min-h-[44px] flex items-center">취소</a>
      </div>

      <form id="write-form" onsubmit="handleSubmit(event)" class="space-y-6">
        <div>
          <label class="block text-body-sm font-semibold text-text-secondary mb-2" for="post-category-input">카테고리</label>
          <select id="post-category-input" required class="w-full bg-surface-container-high border border-outline-variant/40 rounded-xl px-4 py-3 text-on-surface text-body-md focus:outline-none focus:border-primary min-h-[44px]">
            <option value="부동산 뉴스">부동산 뉴스</option>
            <option value="재건축 이슈">재건축 이슈</option>
            <option value="시세 분석">시세 분석</option>
            <option value="대출·세무">대출·세무</option>
            <option value="공지사항">공지사항</option>
          </select>
        </div>

        <div>
          <label class="block text-body-sm font-semibold text-text-secondary mb-2" for="post-title-input">제목</label>
          <input type="text" id="post-title-input" required placeholder="게시글 제목을 입력하세요" class="w-full bg-surface-container-high border border-outline-variant/40 rounded-xl px-4 py-3 text-on-surface text-body-md focus:outline-none focus:border-primary min-h-[44px]">
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-body-sm font-semibold text-text-secondary" for="post-content-input">본문 내용 (마크다운 지원)</label>
            <span class="text-xs text-outline">#, **, -, 링크, 코드블록 지원</span>
          </div>
          <textarea id="post-content-input" rows="14" required placeholder="마크다운 문법을 사용하여 본문을 작성해 주세요. (예: ## 소제목, - 항목, **강조**)" class="w-full bg-surface-container-high border border-outline-variant/40 rounded-xl p-4 text-on-surface text-body-md font-mono focus:outline-none focus:border-primary leading-relaxed"></textarea>
        </div>

        <div class="pt-4 flex flex-col sm:flex-row gap-4">
          <button type="submit" id="submit-btn" class="flex-1 py-4 bg-primary text-on-primary font-semibold rounded-xl hover:bg-primary-fixed transition-colors flex items-center justify-center gap-2 shadow-lg min-h-[44px]">
            <span class="material-symbols-outlined">save</span>
            <span id="btn-text">게시글 저장</span>
          </button>
          <a href="admin.html" class="py-4 px-8 bg-surface-container-highest text-on-surface rounded-xl hover:bg-surface-bright transition-colors text-center font-medium min-h-[44px] flex items-center justify-center">
            취소
          </a>
        </div>
      </form>
    </div>
  </main>

  <script src="db.js"></script>
  <script>
    let editPostId = null;

    async function initForm() {
      requireAdmin();

      const params = new URLSearchParams(window.location.search);
      editPostId = params.get('id');

      if (editPostId) {
        document.getElementById('page-heading').textContent = '게시글 수정';
        document.getElementById('btn-text').textContent = '수정사항 저장';
        const post = await getPostById(editPostId);
        if (post) {
          document.getElementById('post-category-input').value = post.category || '부동산 뉴스';
          document.getElementById('post-title-input').value = post.title || '';
          document.getElementById('post-content-input').value = post.content || '';
        }
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      const category = document.getElementById('post-category-input').value.trim();
      const title = document.getElementById('post-title-input').value.trim();
      const content = document.getElementById('post-content-input').value.trim();

      if (!title || !content) {
        alert('제목과 내용을 모두 입력해 주세요.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50');

      try {
        if (editPostId) {
          await updatePost(editPostId, { title, category, content });
          alert('게시글이 성공적으로 수정되었습니다.');
        } else {
          await createPost({ title, category, content });
          alert('새 게시글이 성공적으로 등록되었습니다.');
        }
        window.location.href = 'admin.html';
      } catch(err) {
        alert('저장 실패: ' + err.message);
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50');
      }
    }

    document.addEventListener('DOMContentLoaded', initForm);
  </script>
</body>
</html>
